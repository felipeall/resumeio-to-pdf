[project]
name = "resumeio-to-pdf"
version = "2.0.0"
description = "Download your resume from resume.io as PDF"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.1",
    "jinja2==3.1.6",
    "requests==2.33.1",
    "uvicorn==0.46.0",
]

[project.scripts]
resumeio-to-pdf = "resumeio_to_pdf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["resumeio_to_pdf"]

[dependency-groups]
dev = [
    "black==26.3.1",
    "pytest==9.1.1",
    "ruff==0.15.12",
]

[tool.black]
line-length = 120
verbose = true
preview = true

[tool.ruff]
line-length = 120
lint.select = [
    "F",  # pyflakes
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "I",  # isort
    "N",  # pep8-naming
    "COM",  # flake8-commas
    "Q",  # flake8-quotes
]
